<!DOCTYPE html>
<html>
<head>
	<title>立體地圖</title>
	<meta property="og:description" content="Go beyond hillshade and show elevation in actual 3D." />
	<meta property="og:created" content="2023-06-27" />
	<meta charset='utf-8'>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel='stylesheet' href='maplibre-gl.css' />
	<link rel='stylesheet' href='lui.css?z=18'>
	<script src="pmtiles.js"></script>
	<script src="ly.js"></script>
	<script src="取瓦.js"></script>
	<script type="importmap">
{
	"imports": {
		"three": "./vendor/three.module.js",
		"three/addons/": "./vendor/addons/"
	}
}
</script>
</head>
<body>
	<div id="map"></div>
	<div id="設置面板">底圖：
		<select id="底圖選單">
			<option value="无" selected>无</option>
			<option value="雄蕊">雄蕊</option>
			<option value="蹤迹">蹤迹</option>
			<option value="製圖師亮">製圖師　亮</option>
			<option value="製圖師暗">製圖師　暗</option>
			<option value="天地圖">天地圖</option>
		</select>
	</div>
	<div id="導航面板" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:950;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,0.12);">
		起点 <input id="起點名" type="text" placeholder="如 远航楼" style="width:110px;padding:4px 6px;">
		终点 <input id="終點名" type="text" placeholder="如 综合楼" style="width:110px;padding:4px 6px;">
		<select id="出行方式" style="padding:4px 6px;">
			<option value="walk">步行</option>
			<option value="drive">驾车</option>
		</select>
		<button id="規劃路線" style="padding:5px 12px;cursor:pointer;">规划路线</button>
		<span id="導航結果" style="font-size:12px;color:#333;"></span>
	</div>
	<script type="module" src="mapa.js?d=22"></script>
</body>
</html>
